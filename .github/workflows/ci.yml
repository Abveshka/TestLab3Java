name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [17, 21]

    steps:
      # Шаг 1. Скачиваем код репозитория на виртуальную машину
      - name: Получить код
        uses: actions/checkout@v4

      # Шаг 2.
      # cache: maven включает кэширование зависимостей
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      # Шаг 3. Сборка, запуск тестов JUnit и проверка покрытия JaCoCo
      - name: Тесты и проверка покрытия (минимум 80%)
        run: mvn -B verify

      # Шаг 4. Сохраняем HTML-отчёт о покрытии
      - name: Сохранить отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-java-${{ matrix.java-version }}
          path: target/site/jacoco